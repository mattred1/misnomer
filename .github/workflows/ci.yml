name: CI

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npx prettier --check .
            - run: npm test

    # Build only for version tags and manual runs. PRs stay on the fast Linux checks.
    # Signing is enabled automatically when the Apple certificate and notarization
    # secrets are present; otherwise an unsigned DMG is produced.
    build:
        needs: test
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        runs-on: macos-latest
        timeout-minutes: 45
        env:
            CSC_LINK: ${{ secrets.CSC_LINK }}
            CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
            APPLE_ID: ${{ secrets.APPLE_ID }}
            APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
            APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
            APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
            APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
            HAS_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.APPLE_TEAM_ID != '' && ((secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '') || (secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '')) }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - run: npm ci

            - name: Build unsigned DMG
              if: env.HAS_SIGNING != 'true'
              run: npm run dist

            - name: Build, sign, and notarize DMG
              if: env.HAS_SIGNING == 'true'
              run: npm run dist:signed

            - name: Verify signature and notarization
              if: env.HAS_SIGNING == 'true'
              run: |
                  spctl --assess --verbose=4 --type exec dist/mac*/Misnomer.app
                  xcrun stapler validate dist/mac*/Misnomer.app
                  codesign --verify --deep --strict --verbose=2 dist/mac*/Misnomer.app

            - uses: actions/upload-artifact@v7
              with:
                  name: misnomer-dmg
                  path: dist/*.dmg
                  if-no-files-found: error

    release:
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: misnomer-dmg
                  path: dist

            - uses: softprops/action-gh-release@v3
              with:
                  files: dist/*.dmg
                  fail_on_unmatched_files: true
                  generate_release_notes: true
